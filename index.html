<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>MC点名</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="stylesheet" href="style.css"/></head><body>
<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="side-animal animal-left"><img src="https://mc-heads.net/body/Fox/256" alt="Minecraft 角色"/></div><div class="side-animal animal-right"><img src="https://mc-heads.net/body/Wolf/256" alt="Minecraft 角色"/></div></div><main>
<header><div></div><div class="header-actions"></div></header>
<section class="control panel"><div class="modes"><button class="mode active" data-mode="单点"><i>⚔</i>单点</button><button class="mode" data-mode="八连抽"><i>✦</i>八连抽</button><button class="mode" data-mode="顺序"><i>▤</i>顺序点名</button></div><button id="startBtn" class="start">开始点名 <span>▶</span></button></section>
<section class="arena panel"><div class="ore ore1"></div><div class="ore ore2"></div><div id="idle" class="idle"><div class="portal"></div><h2>传送门已就绪</h2><p>选择模式，然后启动本次点名</p></div><div id="result" class="result hidden"></div></section>
</main>
<div class="side-tabs"><button id="configBtn" class="side-tab settings-toggle" title="配置名单">⚙<span>设置</span></button><button class="side-tab people-toggle"><span id="studentCount">0 名冒险者</span></button><button id="logToggle" class="side-tab log-toggle">☷<span>日志</span></button></div><aside id="logDrawer" class="log-drawer"><div class="drawer-head"><strong>⌘ 点名日志</strong><button id="closeLog">×</button></div><div id="logs" class="logs"><p class="empty">还没有点名记录</p></div></aside>
<div class="modal hidden" id="modal"><div class="dialog"><button class="close" id="closeModal">×</button><h2>⚙ 配置点名表</h2><p>粘贴学生姓名即可：每行一个，也支持逗号分隔。</p><textarea id="namesInput" placeholder="张小明&#10;李小红&#10;Alex"></textarea><div class="dialog-actions"><button id="demoBtn" class="ghost">载入示例</button><button id="importBtn" class="primary">保存名单</button></div><small>保存后可随时再上传名单；历史点名记录会保留。</small></div></div><div id="toast"></div><script src="app.js"></script></body></html>
